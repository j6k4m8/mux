[package]
name = "mux-native"
version = "0.1.0"
description = "Mux desktop mail client"
authors = ["Mux contributors"]
edition = "2021"
default-run = "mux-native"

[features]
benchmark = []
live-provider-contract = []

[[bin]]
name = "mux-native"
path = "src/main.rs"

[[bin]]
name = "mux-benchmark"
path = "src/bin/mux-benchmark.rs"
required-features = ["benchmark"]

[lib]
name = "mux_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
dom_query = "0.27.0"
fs2 = "0.4"
libc = "0.2"
mail-parser = { version = "0.11.8", default-features = false, features = ["full_encoding"] }
mail-builder = { version = "0.5.0", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = "0.23.40"
rustls-platform-verifier = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.4"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
